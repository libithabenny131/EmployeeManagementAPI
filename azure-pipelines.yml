trigger:
- feature/github-actions

pool:
  vmImage: 'windows-latest'

steps:

- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

- script: dotnet restore
  displayName: 'Restore Packages'

- script: dotnet build --configuration Release
  displayName: 'Build Solution'

- script: dotnet publish EmployeeManagementAPI/EmployeeManagementAPI.csproj -c Release -o $(Build.ArtifactStagingDirectory)/api
  displayName: 'Publish API'

- script: dotnet publish EmployeeManagementUI/EmployeeManagementUI.csproj -c Release -o $(Build.ArtifactStagingDirectory)/ui
  displayName: 'Publish UI'

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'